<div class="min-h-screen bg-[#17130f] flex items-center justify-center px-4">
    <div
      class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8"
    >
  
      <!-- Logo / Heading -->
  
      <div class="text-center mb-8">
  
        <div
          class="w-16 h-16 mx-auto rounded-full bg-[#d9ad5b] flex items-center justify-center mb-4"
        >
          <span class="text-2xl">🍽️</span>
        </div>
  
        <h1 class="text-3xl font-bold text-[#17130f]">
          Admin Login
        </h1>
  
        <p class="text-gray-500 mt-2">
          Anand Family Restaurant
        </p>
  
      </div>
  
  
      <!-- Login Form -->
  
      <form
        (ngSubmit)="login()"
        class="space-y-5"
      >
  
        <!-- Email -->
  
        <div>
  
          <label
            class="block text-sm font-semibold text-gray-700 mb-2"
          >
            Email
          </label>
  
          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Enter admin email"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg
                   focus:outline-none focus:ring-2 focus:ring-[#d9ad5b]"
          />
  
        </div>
  
  
        <!-- Password -->
  
        <div>
  
          <label
            class="block text-sm font-semibold text-gray-700 mb-2"
          >
            Password
          </label>
  
          <input
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter password"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg
                   focus:outline-none focus:ring-2 focus:ring-[#d9ad5b]"
          />
  
        </div>
  
  
        <!-- Error -->
  
        <div
          *ngIf="errorMessage"
          class="bg-red-50 text-red-600 px-4 py-3 rounded-lg text-sm"
        >
          {{ errorMessage }}
        </div>
  
  
        <!-- Login Button -->
  
        <button
          type="submit"
          class="w-full bg-[#d9ad5b] text-[#17130f]
                 font-bold py-3 rounded-lg
                 hover:bg-[#c99b45]
                 transition"
        >
          Login
        </button>
  
      </form>
  
  
      <!-- Back -->
  
      <div class="text-center mt-6">
  
        <a
          routerLink="/"
          class="text-sm text-gray-500 hover:text-[#d9ad5b]"
        >
          ← Back to Restaurant
        </a>
  
      </div>
  
    </div>
  
  </div>
